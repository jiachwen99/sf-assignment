name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Format
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Test
        working-directory: api
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run lint
      - name: Build
        working-directory: web
        run: bun run build
