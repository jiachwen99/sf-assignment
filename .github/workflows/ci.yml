name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Format
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: api
        run: go vet ./...
      # With the race detector, which needs cgo and a C toolchain. The runner
      # has both; a Windows development machine may not, and there it fails
      # open rather than loudly, so this is the only place it actually runs.
      # The event hub is the concurrent code that makes it worth having.
      - name: Test
        working-directory: api
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run lint
      - name: Build
        working-directory: web
        run: bun run build

  # The demo path, against the real stack. Ten thousand rows rather than the two
  # hundred thousand the latency numbers use: seeding that much on every push
  # would dominate the pipeline for no extra signal, and the scale claims are
  # measured locally with the command in docs/05-performance.md.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      # Before the stack, and that order matters. The web service mounts a named
      # volume at /app/node_modules, which sits inside the ./web bind mount, so
      # its mount point is the host's web/node_modules. If Docker gets there
      # first it creates that directory as root and this step then fails with
      # EACCES. Installing first means the directory already exists, owned by
      # the runner, and Docker mounts over it without touching ownership.
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install the browser
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Seed
        working-directory: api
        run: go run ./cmd/seed -n 10000
        env:
          DATABASE_URL: postgres://todo:todo@localhost:5432/todo?sslmode=disable

      - name: Run the demo path
        working-directory: web
        run: bun run test:e2e

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Server logs when it fails
        if: failure()
        run: docker compose logs --no-color
