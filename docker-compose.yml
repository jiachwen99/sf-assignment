services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://todo:todo@db:5432/todo?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: oven/bun:1-alpine
    working_dir: /app
    environment:
      API_URL: "http://api:8080"
      VITE_POLL: "1"
    command: sh -c "bun install && bun run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # node_modules is a named volume rather than part of the bind mount,
      # because the container installs Linux binaries and the host may not be
      # Linux. Sharing one directory would leave whichever ran last broken.
      #
      # The cost: its mount point is the host's web/node_modules, and if Docker
      # creates that directory it does so as root. Run `bun install` on the host
      # before `docker compose up` on a fresh clone, or the host install
      # afterwards fails with EACCES. The CI job installs first for this reason.
      - web-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  web-modules:
